[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-calc"
version = "0.1.0"
description = "Home affordability dashboard: true cost of buying a house, with goal-seek."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "scipy>=1.11",
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
